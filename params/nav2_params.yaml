__NS__:
  slam_toolbox:
    ros__parameters:
      use_sim_time: True
      map_frame: __NS__/map
      base_frame: __NS__/base_footprint
      odom_frame: __NS__/odom
      scan_topic: /__NS__/scan
      mode: mapping
      map_update_interval: 1.0
      resolution: 0.05
      max_laser_range: 20.0
      minimum_time_interval: 0.1
      transform_timeout: 0.2
      tf_buffer_duration: 30.
      stack_size_to_use: 40000000

  amcl:
    ros__parameters:
      use_sim_time: True
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: "__NS__/base_footprint"
      global_frame_id: "__NS__/map"
      odom_frame_id: "__NS__/odom"
      laser_model_type: "likelihood_field"
      max_beams: 60
      max_particles: 2000
      min_particles: 500
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      scan_topic: "scan"
      map_topic: "map"

  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 20.0 # Se sube a 20.0 Hz, ideal para MPPI
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      progress_checker_plugin: "progress_checker"
      goal_checker_plugin: "goal_checker"
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 15.0
        
      goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.3
        yaw_goal_tolerance: 3.14 #Pi radianes 3.14 (no importa la direcciòn)
        stateful: True
        
      FollowPath:
        plugin: "nav2_mppi_controller::MPPIController"
        time_steps: 56
        model_dt: 0.05
        batch_size: 800 #Se cambia de 800
        vx_std: 0.2
        vy_std: 0.2
        wz_std: 0.4
        vx_max: 0.2
        vx_min: -0.2
        vy_max: 0.5
        wz_max: 1.2
        ax_max: 1.0
        ax_min: -3.0
        ay_min: -3.0
        ay_max: 3.0
        az_max: 1.2
        iteration_count: 1
        prune_distance: 1.7
        transform_tolerance: 0.1 #cambio de 0.1
        temperature: 0.3
        gamma: 0.015
        motion_model: "DiffDrive"
        visualize: false
        reset_period: 1.0 # Específico para ROS 2 Humble
        regenerate_noises: false
        TrajectoryVisualizer:
          trajectory_step: 5
          time_step: 3
        TrajectoryValidator:
          plugin: "mppi::DefaultOptimalTrajectoryValidator"
          collision_lookahead_time: 2.0
          consider_footprint: false
        AckermannConstraints:
          min_turning_r: 0.2
        critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
        ConstraintCritic:
          enabled: true
          cost_power: 1
          cost_weight: 4.0
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 1.4
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.5
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 0.5
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 10.0
          critical_cost: 300.0
          consider_footprint: false
          collision_cost: 1000000.0
          near_goal_distance: 1.0
          trajectory_point_step: 2
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 4
          threshold_to_consider: 0.5
          offset_from_furthest: 20
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 1.4
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 2.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.0
          mode: 0

  planner_server:
    ros__parameters:
      expected_planner_frequency: 5.0
      use_sim_time: True
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner/NavfnPlanner"
        tolerance: 0.5
        use_astar: true
        allow_unknown: true

  behavior_server:
    ros__parameters:
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
      spin:
        plugin: "nav2_behaviors/Spin"
      backup:
        plugin: "nav2_behaviors/BackUp"
      drive_on_heading:
        plugin: "nav2_behaviors/DriveOnHeading"
      wait:
        plugin: "nav2_behaviors/Wait"
      global_frame: __NS__/odom
      robot_base_frame: __NS__/base_footprint
      transform_timeout: 0.1
      use_sim_time: true

  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: __NS__/map
      robot_base_frame: __NS__/base_footprint
      odom_topic: /__NS__/odom
      #bt_loop_duration: 100 #Se agrega esto por el colapso en consola de bt navigator
      default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
      plugin_lib_names:
        - nav2_compute_path_to_pose_action_bt_node
        - nav2_compute_path_through_poses_action_bt_node
        - nav2_smooth_path_action_bt_node
        - nav2_follow_path_action_bt_node
        - nav2_spin_action_bt_node
        - nav2_wait_action_bt_node
        - nav2_back_up_action_bt_node
        - nav2_drive_on_heading_bt_node
        - nav2_clear_costmap_service_bt_node
        - nav2_is_stuck_condition_bt_node
        - nav2_goal_reached_condition_bt_node
        - nav2_goal_updated_condition_bt_node
        - nav2_globally_updated_goal_condition_bt_node
        - nav2_is_path_valid_condition_bt_node
        - nav2_initial_pose_received_condition_bt_node
        - nav2_reinitialize_global_localization_service_bt_node
        - nav2_rate_controller_bt_node
        - nav2_distance_controller_bt_node
        - nav2_speed_controller_bt_node
        - nav2_truncate_path_action_bt_node
        - nav2_truncate_path_local_action_bt_node
        - nav2_goal_updater_node_bt_node
        - nav2_recovery_node_bt_node
        - nav2_pipeline_sequence_bt_node
        - nav2_round_robin_node_bt_node
        - nav2_transform_available_condition_bt_node
        - nav2_time_expired_condition_bt_node
        - nav2_path_expiring_timer_condition
        - nav2_distance_traveled_condition_bt_node
        - nav2_single_trigger_bt_node
        - nav2_is_battery_low_condition_bt_node
        - nav2_navigate_through_poses_action_bt_node
        - nav2_navigate_to_pose_action_bt_node
        - nav2_remove_passed_goals_action_bt_node
        - nav2_planner_selector_bt_node
        - nav2_controller_selector_bt_node
        - nav2_goal_checker_selector_bt_node
        - nav2_controller_cancel_bt_node
        - nav2_path_longer_on_approach_bt_node
        - nav2_wait_cancel_bt_node
        - nav2_spin_cancel_bt_node
        - nav2_back_up_cancel_bt_node
        - nav2_drive_on_heading_cancel_bt_node

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: True
        #transform_tolerance: 0.5 #Recien agregado
        global_frame: __NS__/odom
        robot_base_frame: __NS__/base_footprint
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.2
        plugins: ["voxel_layer", "inflation_layer"]
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 5.0
          inflation_radius: 0.3
        voxel_layer:
          plugin: "nav2_costmap_2d::VoxelLayer"
          enabled: True
          publish_voxel_map: False
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          observation_sources: scan
          scan:
            topic: /__NS__/scan
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        always_send_full_costmap: True

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: True
        robot_radius: 0.2
        rolling_window: false 
        track_unknown_space: true    
        transform_tolerance: 2.0 #Cambia de 2.0
        map_subscribe_transient_local: True
        global_frame: __NS__/map         
        robot_base_frame: __NS__/base_footprint
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: /__NS__/scan
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          enabled: True
          subscribe_to_updates: True
          map_topic: /__NS__/map 
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.3
        always_send_full_costmap: True

  waypoint_follower:
    ros__parameters:
      use_sim_time: True
      loop_rate: 20
      stop_on_failure: False
      waypoint_task_executor_plugin: "wait_at_waypoint"
      wait_at_waypoint:
        plugin: "nav2_waypoint_follower::WaitAtWaypoint"
        enabled: True
        waypoint_pause_duration: 0

  velocity_smoother:
    ros__parameters:
      use_sim_time: True
      smoothing_frequency: 20.0
      scale_velocities: False
      feedback: "OPEN_LOOP"
      max_velocity: [0.26, 0.0, 1.0]
      min_velocity: [-0.26, 0.0, -1.0]
      max_acceleration: [2.5, 0.0, 3.2]
      max_deceleration: [-2.5, 0.0, -3.2]
      odom_topic: "odom"
      advancing_distance: 2.0

  smoother_server:
    ros__parameters:
      use_sim_time: True
      smoother_plugins: ["simple_smoother"]
      simple_smoother:
        plugin: "nav2_smoother::SimpleSmoother"
        tolerance: 1.0
        max_its: 1000
        data_type: "Path"

  lifecycle_manager_navigation:
    ros__parameters:
      use_sim_time: True
      autostart: True
      node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'smoother_server', 'velocity_smoother']